name: Provider documentation checks
on:
  # Hosted minutes are exhausted. The identical portable stage runs locally.
  # A future operator can explicitly dispatch after capacity is authorized.
  workflow_dispatch:
    inputs:
      base:
        description: Full comparison-base commit
        required: true
      subject:
        description: Full reviewed subject commit
        required: true
permissions:
  contents: read
jobs:
  provider-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.subject }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install documentation parser only
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.26.0
      - name: Check documentation at exact subject
        env:
          BASE: ${{ inputs.base }}
          SUBJECT: ${{ inputs.subject }}
        run: |
          python3 scripts/check-docs.py --base "$BASE" --subject "$SUBJECT"
      - name: Preserve checked source and evidence
        if: always()
        run: |
          mkdir -p docs-check
          git rev-parse HEAD > docs-check/subject.txt
          git archive --format=tar.gz HEAD > docs-check/revision-source.tar.gz
          sha256sum docs-check/* > docs-check/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-docs-${{ inputs.subject }}
          path: docs-check/
          retention-days: 30
