    adr: ADR-002
    rationale: Supported tool use and adaptive thinking through the existing agent HTTP seam.
    alternative: A different compatible model is a separately qualified profile, not automatic failover.
    footprint: Authorized task context leaves for the admitted model endpoint; USD 1 root admission reservation.
    adaptation: Model proxy enforces exact model/parameters, token and monetary reservations; no prompt caching initially.
  - id: slot.persistence
    kind: persistence
    status: selected-initial-profile
    version: PostgreSQL 16; initial managed Cloud SQL profile
    source: https://www.postgresql.org/docs/16/index.html
    license: PostgreSQL License; managed service commercial terms are separate.
    owner: recovery
    adr: ADR-003
    rationale: Transactions, row locks and unique constraints provide durable task/publication fencing.
    alternative: Redis/Valkey is retained only for expendable presence, not authoritative outcomes.
    footprint: Provider database independent of relay tables and every consumer operational database.
    adaptation: SQLx schemas for roots/reservations/attempts/releases/observations; explicit backup and recovery epoch.
  - id: slot.runtime-image
    kind: deployment
    status: selected-initial-profile
    version: Ubuntu 24.04 LTS; Docker Engine 29.8.1; Rust 1.98.1
    source: https://docs.docker.com/engine/release-notes/29/
    license: Distribution packages retain individual licenses; Engine Apache-2.0; Rust MIT OR Apache-2.0.
    owner: operations
    adr: ADR-003
    rationale: Persistent supervised containers and isolated networks fit ACP/session and durable-worker needs.
    alternative: Scale-to-zero request-only workers do not own long-lived ACP processes.
    footprint: systemd/containers; Cloud SQL, private media and Secret Manager/KMS v1; no Kubernetes requirement.
    adaptation: Non-root restricted runtime, closed egress and separate trusted identities; image digests follow the build.
