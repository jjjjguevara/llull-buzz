[workspace]
members = ["crates/buzz-wire"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/jjjjguevara/llull-buzz"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "=0.2.0"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal", "process", "fs"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid", "migrate", "macros"] }
axum = "=0.8.8"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.22"
nostr = { version = "0.44", features = ["nip98"] }
buzz-auth = { git = "https://github.com/block/buzz", rev = "01b6174a1cbad249e93f31df97d4b2ed1d0e8638" }
buzz-core = { git = "https://github.com/block/buzz", rev = "01b6174a1cbad249e93f31df97d4b2ed1d0e8638" }
# Reserved supported native transport seam; no private ACP/agent library is linked.
buzz-sdk = { git = "https://github.com/block/buzz", rev = "01b6174a1cbad249e93f31df97d4b2ed1d0e8638" }
rmcp = { version = "=1.1.0", features = ["server", "transport-io", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2"
futures-util = "0.3"
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
